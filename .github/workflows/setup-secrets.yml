name: Cấu hình Secrets

on: [workflow_dispatch]

jobs:
  setup-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Thông tin hướng dẫn
        run: |
          echo "Vui lòng thêm các Secrets sau vào GitHub Repository:"
          echo "1. DOCKER_USERNAME - Tên đăng nhập Docker Hub"
          echo "2. DOCKER_PASSWORD - Mật khẩu Docker Hub"
          echo "3. DEPLOY_KEY - Private key SSH để deploy"
          echo "4. DEPLOY_HOST - IP/Domain của server"
          echo "5. DEPLOY_USER - Username SSH để kết nối server"
          echo ""
          echo "Hướng dẫn:"
          echo "Settings → Secrets and variables → Actions → New repository secret"
