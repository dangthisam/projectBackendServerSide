name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    env:
      DB_HOST: mongodb://localhost:27017/testdb
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SESSION_SECRET: nguyenvansamthichdangthithuy
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Cài dependencies
        run: npm ci
      - name: Chạy test
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build và push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nguyenvansam-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/nguyenvansam-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy lên Railway
        run: |
          npm install -g @railway/cli
          railway up --image ${{ secrets.DOCKER_USERNAME }}/nguyenvansam-backend:latest
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}